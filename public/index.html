<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gaming Coins">
<meta name="theme-color" content="#2a36e0">
<title>Gaming Coins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: lekent, varmt og tydelig – en spill-lobby hjemme; store mål for små fingre, rolig og ryddig for foreldre.
   IDEA: arkade-token – alt tjenes, telles og brukes i preget gullmynt; oppgaver er «oppdrag», spilletid er en konsoll.
   PICTURE: spillkort per barn med fargebanner, avatar og myntsaldo; nedtellingsringer; konsollpanel med stor timer.
   COLOUR and TYPE: dyp kobolt med lysglød og prikkrutenett, myntgull som aksent, mint/korall for handlinger; Baloo 2 + Nunito.
   LAYOUT: veggskjerm først – rutenett av spillkort; barnevisning med banner, segmenterte faner og kortrutenett. */
:root{color-scheme:light dark;--bg1:#3a4cff;--bg2:#1a1fae;--card:#ffffff;--card2:#f1f3ff;--card3:#e6e9ff;--ink:#121640;--mute:#5d6493;--line:#e3e6fb;--edge:rgba(12,16,110,.55);--smodel:#2f45ff;
  --gold:#ffc21a;--gold2:#e08e00;--coral:#ff5b4f;--ok:#14b86a;--blue:#2f45ff}
/* mørk modus via media query – fungerer også i eldre Android-nettlesere */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#1a2185;--bg2:#070a33;--card:#1b2272;--card2:#262f8c;--card3:#303a9e;--ink:#f4f5ff;--mute:#b9bef0;--line:#343d9c;--edge:rgba(0,0,0,.55);--smodel:#a9b6ff}}
:root[data-theme=dark]{--bg1:#1a2185;--bg2:#070a33;--card:#1b2272;--card2:#262f8c;--card3:#303a9e;--ink:#f4f5ff;--mute:#b9bef0;--line:#343d9c;--edge:rgba(0,0,0,.55);--smodel:#a9b6ff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
html{background:var(--bg2)}
body{margin:0;color:#fff;font:600 17px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip;user-select:none;-webkit-user-select:none}
html::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(1000px 640px at 8% -12%,rgba(130,200,255,.5),transparent 62%),
    radial-gradient(900px 640px at 108% 108%,rgba(255,194,26,.32),transparent 60%),
    linear-gradient(165deg,var(--bg1),var(--bg2))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.16) 1.3px,transparent 1.6px);background-size:28px 28px;
  -webkit-mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.35) 70%,transparent);mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.35) 70%,transparent)}
#app{position:relative;z-index:1}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.card.running h3{font-size:24px}
input,select,textarea{user-select:text;-webkit-user-select:text}
h1,h2,h3,.disp{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;line-height:1.05;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(16px,2.6vw,30px) max(3vw,14px) 120px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg.coin{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;filter:drop-shadow(0 2px 0 rgba(120,60,0,.25))}
.grow{flex:1}

/* ---------- topp ---------- */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:clamp(18px,3vw,32px)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:46px;
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(0,0,40,.3);border:1px solid rgba(255,255,255,.25)}
.logo svg.coin{width:1em;height:1em;animation:spin 7s ease-in-out infinite}
@keyframes spin{0%,82%{transform:rotateY(0)}91%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.wm{font:800 clamp(30px,4.2vw,46px)/1 "Baloo 2",sans-serif;letter-spacing:.3px;text-shadow:0 3px 0 rgba(0,0,60,.25)}
.wm b{color:var(--gold)}
.sub{font-size:15px;opacity:.85;margin-top:4px}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font:800 clamp(30px,3.6vw,44px)/1 "Baloo 2",sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,60,.25)}
.win{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;font-weight:800;font-size:15px;
  background:rgba(8,10,60,.28);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.win::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(255,91,79,.28)}
.win.open::before{background:#3dff9a;box-shadow:0 0 0 4px rgba(61,255,154,.28),0 0 14px #3dff9a;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(61,255,154,.1),0 0 18px #3dff9a}}

/* ---------- barnekort (startskjerm) ---------- */
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:clamp(16px,2.4vw,28px)}
.kid{position:relative;text-align:center;background:var(--card);color:var(--ink);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 12px 0 var(--edge),0 26px 50px rgba(0,0,40,.32);transition:transform .15s ease,box-shadow .15s ease}
.kid:active{transform:translateY(8px) scale(.99);box-shadow:0 4px 0 var(--edge),0 10px 24px rgba(0,0,40,.3)}
.hero{position:relative;height:138px;
  background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.45),transparent 38%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 16px,transparent 16px 32px),
    linear-gradient(140deg,transparent,rgba(16,16,106,0.38)),var(--c);background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.45),transparent 38%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 16px,transparent 16px 32px),
    linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 62%,#10106a))}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:40px;background:var(--card);border-radius:50% 50% 0 0/100% 100% 0 0}
.av{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:66px;line-height:1;overflow:hidden;
  box-shadow:0 0 0 6px var(--card),0 0 0 12px rgba(0,0,0,.1),0 14px 26px rgba(0,0,40,.25);box-shadow:0 0 0 6px var(--card),0 0 0 12px color-mix(in srgb,var(--c) 35%,transparent),0 14px 26px rgba(0,0,40,.25)}
.hero .av{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);z-index:2;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateX(-50%) translateY(-5px)}}
.lvl,.live{position:absolute;top:14px;padding:5px 12px;border-radius:999px;font-weight:800;font-size:14px;color:#fff;background:rgba(0,0,40,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lvl{right:14px}.live{left:14px;display:inline-flex;gap:6px;align-items:center;background:var(--ok)}
.live svg.i{width:14px;height:14px}
.kid.playing{box-shadow:0 12px 0 var(--edge),0 0 0 4px #3dff9a,0 26px 60px rgba(61,255,154,.35)}
.kbody{padding:38px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;flex:1}
.kid h2{font-size:clamp(30px,3vw,38px)}
.token{display:inline-flex;align-items:center;gap:8px;padding:6px 20px 6px 8px;border-radius:999px;
  font:800 34px/1.1 "Baloo 2",sans-serif;color:#5a3700;
  background:linear-gradient(180deg,#fff6cc,#ffd34d 55%,#ffbf1a);box-shadow:0 5px 0 var(--gold2),inset 0 2px 0 #fff,0 10px 20px rgba(224,142,0,.3)}
.token svg.coin{width:44px;height:44px}

/* ---------- Kunnskapsløpet ---------- */
.av img.faceimg,.rc-face img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.racecard{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:30px;padding:18px 22px;margin-bottom:22px;color:#fff;
  background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.35),transparent 40%),repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 14px,transparent 14px 28px),linear-gradient(120deg,#ff5a5f,#ff9a3d);
  box-shadow:0 9px 0 #b3362f,0 18px 34px rgba(179,54,47,.3)}
.racecard h3{font:800 28px/1.1 "Baloo 2",sans-serif;margin:0 0 4px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.racecard p{margin:0;font-weight:700;opacity:.95}
.rcc-art{width:150px;height:110px;position:relative;flex:none}
.rcc-art .racer{position:absolute;left:0;bottom:0;animation:rcbob 1.2s ease-in-out infinite}
.rcc-btns{display:flex;flex-direction:column;gap:8px}
@keyframes rcbob{50%{transform:translateY(-4px)}}
.racer{position:absolute;width:130px;height:110px;bottom:4px;left:calc(var(--p,0) * (100% - 170px) + 30px);transition:left .7s cubic-bezier(.3,1.3,.5,1)}
.rcc-art .racer{left:0}
.racer .kart{position:absolute;left:0;bottom:0;width:130px;height:70px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.racer .rhead{position:absolute;left:44px;bottom:42px;width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid var(--rc);overflow:hidden;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18);z-index:2}
.racer .rhead img{width:100%;height:100%;object-fit:cover}
.racer .rh-e{font-size:34px;line-height:1}
.racer .rlines{position:absolute;left:-34px;bottom:10px;font-size:30px;opacity:0}
.racer.zoom .rlines{animation:rcl .7s}
.racer.zoom .whl{animation:rcw .7s linear;transform-box:fill-box;transform-origin:center}
.racer.spin{animation:rcspin .9s}
@keyframes rcl{0%,80%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-30px)}}
@keyframes rcw{to{transform:rotate(720deg)}}
@keyframes rcspin{25%{transform:rotate(-14deg) translateX(-6px)}50%{transform:rotate(12deg)}75%{transform:rotate(-8deg)}}
.rc{position:fixed;inset:0;z-index:8000;overflow:auto;background:linear-gradient(165deg,#3a4cff,#1a1fae);color:#fff;-webkit-overflow-scrolling:touch}
.rc-box,.fc-box{max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) clamp(12px,3vw,28px) 30px}
.rc-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.rc-top h2{flex:1;margin:0;font:800 clamp(24px,3vw,34px)/1.1 "Baloo 2",sans-serif}
.rc-top h2 small{font-size:.55em;opacity:.8}
.rc-subj{font-weight:800;background:rgba(255,255,255,.16);padding:6px 14px;border-radius:99px}
.rc-x{width:56px;height:56px;border-radius:50%;border:0;background:#fff;color:#1a1fae;font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer;flex:none}
.rc-lead{font-weight:700;font-size:18px;margin:0 0 6px}
.rc-box h3{font:800 20px "Baloo 2",sans-serif;margin:18px 0 8px}
.rc-small{opacity:.85;font-weight:700;font-size:15px}
.rc-pick{display:flex;gap:12px;flex-wrap:wrap}
.rc-p{border:0;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;border-radius:24px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.2);transition:transform .1s}
.rc-p.on{background:#fff;color:#1a1fae;box-shadow:0 0 0 4px var(--c),0 6px 0 rgba(0,0,0,.2);transform:translateY(-3px)}
.rc-p b{font:800 18px "Baloo 2",sans-serif}
.rc-face{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#fff;overflow:hidden;font-size:42px;line-height:1;box-shadow:0 0 0 4px var(--c,#fff);flex:none}
.rc-face.sm{width:48px;height:48px;font-size:28px}.rc-face.xs{width:34px;height:34px;font-size:20px;box-shadow:0 0 0 2px #fff}
.rc-face.big{width:96px;height:96px;font-size:56px}
.rc-chips{display:flex;flex-wrap:wrap;gap:8px}
.rc-chips button{border:0;cursor:pointer;border-radius:99px;padding:10px 16px;font:800 17px "Baloo 2",sans-serif;background:rgba(255,255,255,.14);color:#fff}
.rc-chips button.on{background:#ffc21a;color:#3a2600;box-shadow:0 4px 0 #e08e00}
.rc-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.rc-btn{border:0;cursor:pointer;border-radius:22px;padding:16px 26px;font:800 22px "Baloo 2",sans-serif;min-width:150px}
.rc-btn.go{background:#16c28f;color:#fff;box-shadow:0 6px 0 #0d8a64}
.rc-btn.go:disabled{opacity:.45}
.rc-btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.rc-btn:active{transform:translateY(4px)}
.rtrack{display:grid;gap:10px;margin:6px 0 14px}
.rlane{position:relative;height:122px;border-radius:24px;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 30px,transparent 30px 60px) 0 70% / 100% 4px no-repeat,linear-gradient(#5b6170,#454a57);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.rlane.left{opacity:.45}
.rl-name{position:absolute;left:12px;top:8px;z-index:3;font:800 16px "Baloo 2",sans-serif;background:var(--c);padding:2px 12px;border-radius:99px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.rl-score{position:absolute;right:70px;top:8px;z-index:3;font:800 16px "Baloo 2",sans-serif;background:rgba(0,0,0,.3);padding:2px 10px;border-radius:99px}
.rl-flag{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:44px}
.rlane::after{content:"";position:absolute;right:62px;top:0;bottom:0;width:16px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/16px 16px;opacity:.9}
.rc-mid{text-align:center;padding:10px 0}
.rc-mid h2{font:800 26px "Baloo 2",sans-serif;margin:6px 0}
.rc-big{font-size:90px}
.rc-wait{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.rc-ws{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 14px 6px 6px;font-weight:800}
.rc-ws.on{background:#16c28f}.rc-ws.no{opacity:.5}
.rc-count{font:800 150px/1 "Baloo 2",sans-serif;text-shadow:0 8px 0 rgba(0,0,0,.25)}
.rc-count.pulse{animation:plpop2 .5s}
@keyframes plpop2{from{transform:scale(1.8);opacity:.2}}
.rc-q{background:#fff;color:#121640;border-radius:30px;padding:18px;min-height:200px;box-shadow:0 8px 0 rgba(0,0,0,.2);transition:filter .2s}
.rc-q .rc-mid h2{color:#121640}
.rc-q.stun{filter:grayscale(.8) blur(1px);pointer-events:none}
.rq{text-align:center}
.rq-pic{font-size:54px;line-height:1.15;margin-bottom:6px;word-break:break-all}.rq-pic.many{font-size:36px}
.rq-pic svg{width:180px;height:180px}
.rq-text{font:800 clamp(24px,3.4vw,36px)/1.2 "Baloo 2",sans-serif;margin-bottom:14px}
.rq-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.rq-opts button{border:0;cursor:pointer;border-radius:22px;padding:18px 12px;font:800 clamp(20px,2.6vw,28px)/1.1 "Baloo 2",sans-serif;background:#eef1ff;color:#1a1fae;box-shadow:0 6px 0 #c9d0ff;touch-action:manipulation}
.rq-opts button.right{background:#16c28f;color:#fff;box-shadow:0 6px 0 #0d8a64}
.rq-opts button.wrong{background:#ff5b4f;color:#fff;box-shadow:0 6px 0 #b8322a;animation:rcspin .5s}
.rq-opts button.dim{opacity:.45}
.rc-win{font-size:40px!important}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:44px}
.pod{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:150px}
.pod b{font:800 22px "Baloo 2",sans-serif}.pod small{font-weight:700;opacity:.9}
.pod-c{font:800 22px "Baloo 2",sans-serif;color:#ffd23f}
.pod-b{width:100%;border-radius:18px 18px 0 0;background:var(--c);display:grid;place-items:center;font:800 40px "Baloo 2",sans-serif;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.pod.p1 .pod-b{height:120px}.pod.p2 .pod-b{height:80px}.pod.p3 .pod-b,.pod.p4 .pod-b,.pod.p5 .pod-b,.pod.p6 .pod-b{height:56px}
.pod.p1{order:2}.pod.p2{order:1}.pod.p3{order:3}
.crown{position:absolute;top:-34px;font-size:44px;animation:rcbob 1s ease-in-out infinite}
.invites{display:grid;gap:10px;margin-bottom:16px}
.invite{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;color:#121640;border-radius:24px;padding:12px 16px;box-shadow:0 0 0 4px var(--c),0 8px 0 rgba(0,0,0,.2);animation:invpop .5s cubic-bezier(.3,1.6,.5,1)}
.invite b{display:block;font:800 20px "Baloo 2",sans-serif}.invite small{color:#5d6493;font-weight:700}
.inv-btns{display:flex;gap:6px;flex-wrap:wrap}
@keyframes invpop{from{transform:scale(.8);opacity:0}}
.livebar{display:flex;align-items:center;gap:10px;width:100%;border:0;cursor:pointer;text-align:left;color:#fff;margin-bottom:14px;border-radius:22px;padding:10px 14px;background:linear-gradient(90deg,#ff3b5c,#ff8a3d);box-shadow:0 6px 0 #b3243e;font-weight:800}
.livebar .vs{font-size:13px;opacity:.85}
.lb-dot{width:12px;height:12px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.fc{position:fixed;inset:0;z-index:8500;background:rgba(10,12,60,.92);color:#fff;overflow:auto}
.fc-view{position:relative;width:min(80vw,420px);aspect-ratio:1;margin:10px auto;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 0 6px #fff,0 0 0 14px rgba(255,255,255,.2)}
.fc-view video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.fc-view canvas{width:100%;height:100%;touch-action:none;cursor:grab}
.fc-ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.6);pointer-events:none}
.fc-zoom{display:block;width:min(80vw,420px);margin:0 auto}
.fc-shot{width:110px;height:110px;border-radius:50%!important;font-size:46px!important;min-width:0!important;padding:0!important}
.fc-mid{text-align:center;padding:30px 0}
/* ---------- lekeland ---------- */
.lekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:22px}
.lektile{position:relative;aspect-ratio:1;border:0;border-radius:36px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55),transparent 45%),var(--k);box-shadow:0 9px 0 rgba(0,0,0,.3),0 16px 26px rgba(0,0,0,.18);box-shadow:0 9px 0 color-mix(in srgb,var(--k) 65%,#000),0 16px 26px rgba(0,0,0,.18);transition:transform .12s}
.lektile:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.3);box-shadow:0 3px 0 color-mix(in srgb,var(--k) 65%,#000)}
.lektile span{font-size:clamp(64px,9vw,92px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15));animation:lekwig 3s ease-in-out infinite}
.lektile:nth-child(2n) span{animation-delay:-1.5s}
.lektile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lektile b{position:relative;font:800 17px/1.1 "Baloo 2",sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);background:rgba(0,0,0,.12);padding:2px 12px;border-radius:99px}
@keyframes lekwig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
@media (prefers-reduced-motion:reduce){.lektile span{animation:none}}
/* ---------- familiepotten: diamanter ---------- */
.token.gems{color:#2a1670;background:linear-gradient(180deg,#f1fcff,#9fe6ff 50%,#a98bff);box-shadow:0 5px 0 #5b3fd6,inset 0 2px 0 #fff,0 10px 20px rgba(91,63,214,.32)}

  background:radial-gradient(circle at 92% 10%,rgba(255,255,255,.35),transparent 38%),repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 16px,transparent 16px 32px),linear-gradient(130deg,#2fb8ff,#6a45ff 60%,#b04dff);
  box-shadow:0 10px 0 #3a1f9e,0 22px 40px rgba(58,31,158,.35);transition:transform .15s}

.famban h2{font-size:clamp(26px,3vw,34px);text-shadow:0 3px 0 rgba(0,0,40,.2)}
.famban .fsub{font-weight:800;opacity:.92}
.famban .fgoal{flex:1;min-width:200px}
.fbar{position:relative;height:22px;border-radius:999px;background:rgba(0,0,40,.3);overflow:hidden;margin-top:6px}
.fbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#b8f4ff,#fff)}
.fbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;color:#2a1670;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.famban .avs{display:flex}.famban .avs span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#fff;margin-left:-8px;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.khead.fam{--c:#6a45ff}
.waylist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-bottom:18px}
.way{display:flex;gap:12px;align-items:center;background:var(--card);color:var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 var(--edge)}
.way .wi{font-size:34px}.way b{display:block;font:800 18px/1.2 "Baloo 2",sans-serif}.way small{color:var(--mute);font-weight:700}
.contrib{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:44px minmax(80px,140px) 1fr auto;gap:12px;align-items:center}
.crow .av{width:44px;height:44px;font-size:26px;box-shadow:none;background:var(--card);background:color-mix(in srgb,var(--c) 22%,var(--card));animation:none}
.contrib{padding:16px 18px;margin-bottom:18px;color:var(--ink)}
.crow .cbar{height:16px;border-radius:999px;background:var(--card3);overflow:hidden}.crow .cbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4fc8ff,#8a5cff)}
.card.product.fam .save i{background:linear-gradient(90deg,#4fc8ff,#8a5cff)}
.card.product.fam .price{color:#6a45ff}
.pbadge.gemb{background:linear-gradient(90deg,#2fb8ff,#8a5cff)}
.btn.gemb{--b:#6a45ff;--bs:#3a1f9e}
.token.big{font-size:clamp(34px,4vw,46px);padding:6px 24px 6px 10px}.token.big svg.coin{width:54px;height:54px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:4px}
.stat{background:var(--card2);border-radius:16px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center}
.stat small{font-size:12px;color:var(--mute);font-weight:800}
.stat b{font:800 18px/1.1 "Baloo 2",sans-serif;white-space:nowrap}
.xp{display:block;width:84%;height:9px;border-radius:9px;background:var(--card3);overflow:hidden;margin:4px 0}
.xp i,.xpbar i,.save i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),#ff9b3d)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;white-space:nowrap}
.chip.hot{background:var(--coral);color:#fff}.chip.go{background:var(--ok);color:#fff}.chip.gold{background:var(--gold);color:#3b2600}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px max(3vw,14px) calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.dock>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:58px;padding:0 24px;border-radius:999px;background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 6px 0 var(--edge),0 14px 30px rgba(0,0,40,.3)}
.pill:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.badge{background:var(--coral);color:#fff;border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center;padding:0 8px;font-size:14px;font-weight:800}
.note{font-size:14px;background:rgba(0,0,40,.3);padding:7px 14px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* ---------- barnevisning ---------- */
.khead{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:32px;padding:20px 22px;color:#fff;overflow:hidden;margin-bottom:16px;
  background:radial-gradient(circle at 90% 0%,rgba(255,255,255,.4),transparent 40%),repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 16px,transparent 16px 32px),linear-gradient(140deg,transparent,rgba(16,16,106,0.4)),var(--c);background:radial-gradient(circle at 90% 0%,rgba(255,255,255,.4),transparent 40%),repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 16px,transparent 16px 32px),linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 60%,#10106a));
  box-shadow:0 10px 0 rgba(0,0,40,.28),0 24px 44px rgba(0,0,40,.28)}
.khead .av{width:92px;height:92px;font-size:54px;box-shadow:0 0 0 5px rgba(255,255,255,.75),0 10px 20px rgba(0,0,40,.25)}
.kinfo{flex:1;min-width:200px}
.kinfo h1{font-size:clamp(32px,4.2vw,48px);text-shadow:0 3px 0 rgba(0,0,40,.2)}
.kmeta{display:flex;gap:14px;flex-wrap:wrap;font-weight:800;margin:2px 0 8px}
.kmeta span{display:inline-flex;align-items:center;gap:5px}.kmeta svg.i{width:18px;height:18px}
.xpbar{position:relative;height:24px;border-radius:999px;background:rgba(0,0,40,.28);overflow:hidden;max-width:360px}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.back{width:58px;height:58px;border-radius:50%;background:rgba(0,0,40,.25);display:grid;place-items:center;color:#fff;flex:none}
.back:active{transform:scale(.94)}
.segtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px;border-radius:24px;margin-bottom:22px;
  background:rgba(8,10,60,.3);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.segtabs button{min-height:58px;border-radius:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s}
.segtabs button.on{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--edge)}
.pane.anim{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{min-height:52px;padding:0 18px;border-radius:999px;background:rgba(8,10,60,.28);font-weight:800;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14)}
.tab.on{background:var(--card);color:var(--ink);border-color:transparent}
.sec{margin:8px 0 14px;font-size:26px;display:flex;align-items:center;gap:12px;text-shadow:0 2px 0 rgba(0,0,40,.2)}
.dot{width:14px;height:14px;border-radius:5px;background:var(--k);box-shadow:0 0 0 4px rgba(0,0,0,.1);box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 30%,transparent);flex:none;transform:rotate(45deg)}
.count{margin-left:auto;font:800 14px Nunito,sans-serif;background:rgba(8,10,60,.3);padding:5px 12px;border-radius:999px;text-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));gap:16px;margin-bottom:30px}
.card{position:relative;background:var(--card);color:var(--ink);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 7px 0 var(--edge),0 16px 30px rgba(0,0,40,.22)}
.card h3{font-size:22px;line-height:1.1}
.qtop{display:flex;justify-content:space-between;align-items:flex-start}
.qicon{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:42px;line-height:1;overflow:hidden;flex:none;
  background:linear-gradient(150deg,rgba(255,255,255,0.78),rgba(255,255,255,0.6)),var(--k,#2fa4ff);background:linear-gradient(150deg,color-mix(in srgb,var(--k,#2fa4ff) 22%,#fff),color-mix(in srgb,var(--k,#2fa4ff) 40%,#fff));box-shadow:inset 0 -4px 0 rgba(0,0,0,.1);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--k,#2fa4ff) 35%,transparent)}
.qicon .icimg{width:100%;height:100%;border-radius:0}
.qicon.sm{width:52px;height:52px;font-size:30px;border-radius:16px;margin-bottom:6px}
.qicon.xs{width:46px;height:46px;font-size:26px;border-radius:14px;--k:#8b7bff}
.reward{display:inline-flex;align-items:center;gap:4px;padding:5px 12px 5px 6px;border-radius:999px;font:800 20px/1 "Baloo 2",sans-serif;color:#5a3700;
  background:linear-gradient(180deg,#fff3bf,#ffcd3c);box-shadow:0 3px 0 var(--gold2);white-space:nowrap}
.reward svg.coin{width:24px;height:24px}
.reward.inline{font-size:17px;padding:3px 10px 3px 4px}.reward.inline svg.coin{width:20px;height:20px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:15px;font-weight:800}
.meta>span{display:inline-flex;align-items:center;gap:5px}.meta svg.i{width:17px;height:17px}
.quest>.btn{margin-top:auto}
.quest.done{opacity:.6;filter:saturate(.6)}
.card.running{background:linear-gradient(160deg,var(--card),var(--card));background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--gold) 14%,var(--card)));box-shadow:0 7px 0 var(--gold2),0 0 0 3px var(--gold),0 18px 40px rgba(255,194,26,.3)}
.liverow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{--p:1;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*360deg),var(--card3) 0);filter:drop-shadow(0 4px 8px rgba(224,142,0,.3))}
.ring span{width:82px;height:82px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:800 23px "Baloo 2",sans-serif;font-variant-numeric:tabular-nums}
.ring.warn{background:conic-gradient(var(--coral) calc(var(--p)*360deg),var(--card3) 0);animation:pulse2 1s infinite}
@keyframes pulse2{50%{filter:drop-shadow(0 0 12px rgba(255,91,79,.6))}}

/* knapper */
.btn{--b:var(--blue);--bs:#1a28b8;white-space:nowrap;min-height:54px;border-radius:18px;padding:0 20px;font-weight:800;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 52%),var(--b);box-shadow:0 5px 0 var(--bs),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bs)}
.btn.gold{--b:var(--gold);--bs:var(--gold2);color:#3b2600}
.btn.ok{--b:var(--ok);--bs:#0b8a4c}
.btn.bad{--b:var(--coral);--bs:#c8352b}
.btn.ghost{--b:var(--card2);--bs:var(--card3);color:var(--ink);background:var(--card2);box-shadow:0 4px 0 var(--card3)}
.btn[disabled]{opacity:.5;pointer-events:none;filter:saturate(.5)}
.btn.sm{min-height:44px;padding:0 14px;border-radius:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}

/* konsoll */
.console{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center;border-radius:32px;padding:clamp(18px,2.4vw,28px);margin-bottom:30px;color:#fff;
  background:radial-gradient(circle at 15% 0%,rgba(120,180,255,.25),transparent 50%),linear-gradient(160deg,#141a5e,#080b2e);
  box-shadow:0 10px 0 #04061c,0 26px 50px rgba(0,0,30,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.console.on{box-shadow:0 10px 0 #04061c,0 0 0 3px #3dff9a,0 26px 60px rgba(61,255,154,.3)}
.screen{border-radius:22px;padding:18px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.screen .lab{font-weight:800;opacity:.75}
.console .t{font:800 clamp(56px,8.5vw,104px)/1 "Baloo 2",sans-serif;font-variant-numeric:tabular-nums;margin:6px 0 12px;color:#fff;text-shadow:0 0 30px rgba(120,180,255,.6)}
.console.on .t{color:#7dffbd;text-shadow:0 0 30px rgba(61,255,154,.6)}
.console .win{background:rgba(255,255,255,.08)}
.ctrl p{text-align:center;opacity:.75;margin:12px 0 0}
.bigbtn{min-height:100px;border-radius:28px;font:800 32px "Baloo 2",sans-serif;width:100%}
.bigbtn svg.i{width:30px;height:30px}

/* butikk */
.shopc{align-items:flex-start}
.shopc .min{font:800 46px/1 "Baloo 2",sans-serif}.shopc .min small{font-size:20px;margin-left:4px;color:var(--mute)}
.price{font:800 26px "Baloo 2",sans-serif;display:flex;align-items:center;gap:6px;margin-top:auto}
.save{width:100%;height:8px;border-radius:9px;background:var(--card3);overflow:hidden}
.shopc>.btn{width:100%}

.list{background:var(--card);color:var(--ink);border-radius:26px;padding:6px 18px;box-shadow:0 7px 0 var(--edge),0 16px 30px rgba(0,0,40,.2);margin-bottom:30px}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}

.plus{color:var(--ok);font-weight:800;white-space:nowrap}.minus{color:var(--coral);font-weight:800;white-space:nowrap}
.empty{background:rgba(8,10,60,.28);border:1px dashed rgba(255,255,255,.3);border-radius:26px;padding:26px;text-align:center;margin-bottom:24px}
.offline{background:var(--coral);color:#fff;text-align:center;padding:10px;font-weight:800;border-radius:16px;margin-bottom:14px}
.mute{color:var(--mute)}

/* ---------- foreldre ---------- */
.panel{background:var(--card);color:var(--ink);border-radius:28px;padding:clamp(16px,2.2vw,24px);box-shadow:0 8px 0 var(--edge),0 18px 34px rgba(0,0,40,.2);margin-bottom:20px}
.panel h3{font-size:23px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:800}
.fld input,.fld select,input.in,select.in{font:700 16px Nunito,sans-serif;color:var(--ink);background:var(--card2);border:2px solid transparent;border-radius:14px;min-height:48px;padding:0 12px;width:100%}
.fld input:focus,.fld select:focus,input.in:focus{border-color:var(--blue);outline:0;background:var(--card)}
.erow{display:grid;grid-template-columns:64px minmax(0,2.4fr) repeat(4,minmax(0,1fr)) 48px;gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.erow.shopr{grid-template-columns:64px minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 48px}
.erow.dev{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 48px}
.ib{width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;color:var(--coral)}
.sched{display:grid;grid-template-columns:120px 70px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sw{position:relative;width:60px;height:36px;border-radius:99px;background:var(--card3);transition:.2s}
.sw.on{background:var(--ok)}.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sw.on::after{left:28px}
.seg{display:inline-flex;color:var(--ink);background:var(--card2);border-radius:18px;padding:5px;gap:5px;flex-wrap:wrap}
.seg button{min-height:46px;padding:0 16px;border-radius:14px;font-weight:800}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 #1a28b8}
.appr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.appr:last-child{border-bottom:0}

.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;background:var(--ok);color:#fff}
.tag.late{background:var(--coral)}
.icimg{width:1.1em;height:1.1em;object-fit:cover;border-radius:.25em;vertical-align:-.15em;display:inline-block}
.av .icimg{width:100%;height:100%;border-radius:50%}
.icbtn{min-height:48px;width:100%;border-radius:14px;background:var(--card2);font-size:26px;display:grid;place-items:center;border:2px dashed var(--line)}

.icprev{width:88px;height:88px;border-radius:24px;background:var(--card2);display:grid;place-items:center;font-size:52px;overflow:hidden}

.iccat{text-align:left;font-weight:800;color:var(--mute);font-size:14px;margin:12px 0 6px}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.icgrid button{height:48px;border-radius:12px;background:var(--card2);font-size:26px}
.icgrid button:active{background:var(--gold)}

.drv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.drv button{text-align:left;padding:14px;border-radius:18px;background:var(--card2);border:2px solid transparent;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-height:92px}
.drv button.on{border-color:var(--blue);background:var(--card);box-shadow:0 0 0 4px rgba(0,0,0,.1);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent)}
.drv b{font:800 19px "Baloo 2",sans-serif}.drv small{color:var(--mute);font-weight:700;font-size:13px;line-height:1.3}
.scan{margin-top:14px;border-radius:22px;padding:16px;background:var(--card2)}
.scanhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.scanhead .qicon{color:#fff;background:var(--k);box-shadow:none}.scanhead .qicon svg.i{width:34px;height:34px}
.sbrand{font:800 26px/1.1 "Baloo 2",sans-serif}.smodel{font:800 20px "Baloo 2",sans-serif;color:var(--smodel)}
.sw[disabled]{opacity:.4}
.guide h4{font:800 20px "Baloo 2",sans-serif;margin:20px 0 8px}
.gintro p{margin:0 0 10px}
.gstep{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}

.gnum{width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;font:800 17px "Baloo 2",sans-serif;background:var(--blue);color:#fff}
.cmd{display:flex;gap:8px;align-items:center;margin-top:8px;background:#0d1240;color:#d6ddff;border-radius:14px;padding:6px 6px 6px 14px}
.cmd code{flex:1;font:600 14px ui-monospace,Menlo,monospace;overflow-x:auto;white-space:nowrap;user-select:all;-webkit-user-select:all}
.cmd .btn.ghost{background:#262f8c;color:#fff;box-shadow:none}
.guide code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--card2);padding:1px 6px;border-radius:6px}
.cmd code{background:none;padding:0}
.trouble{margin:8px 0 0;padding-left:20px}.trouble li{margin:6px 0}
.gsum{cursor:pointer;font:800 23px "Baloo 2",sans-serif;list-style-position:inside}
button.note{color:#fff;font-weight:700;cursor:pointer}
.card.product{padding:0;gap:0;overflow:hidden}

<script>
(() => {
const L = window.GCLogic;
const $app = document.getElementById('app');
const A = { mode: 'demo', S: null, offset: 0, screen: 'home', kidId: null, tab: 'tasks', ptab: 'approve',
  pin: null, pinEntry: '', modal: null, prevCoins: {}, lastTouch: Date.now(), pending: false, offline: false, clients: null };
const now = () => Date.now() + A.offset;
const darken = (hex, f = 0.7) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '')); if (!m) return 'rgba(0,0,0,.3)'; const n = parseInt(m[1], 16); return `rgb(${Math.round((n >> 16) * f)},${Math.round((n >> 8 & 255) * f)},${Math.round((n & 255) * f)})`; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const coin = '<svg class="coin"><use href="#coin"/></svg>';
const gem = '<svg class="coin gem"><use href="#gem"/></svg>';
const hhmm = (t) => new Date(t).toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
const fmtDur = (sec) => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`; };
const fmtMin = (sec) => { const m = Math.floor(sec / 60); return m >= 60 ? `${Math.floor(m / 60)} t ${m % 60} min` : `${m} min`; };
const kidById = (id) => A.S.kids.find((k) => k.id === id);
const pendCount = () => A.S.jobs.filter((j) => j.status === 'pending').length + (A.S.rewards || []).filter((r) => r.status === 'pending').length + (A.S.loans || []).filter((l) => l.status === 'parent').length;
const isImg = (v) => /^data:image\//.test(String(v || ''));
const icn = (v) => isImg(v) ? `<img class="icimg" src="${esc(v)}" alt="">` : esc(v);
const icBtn = (up, id, k, v) => `<button class="icbtn" data-act="pickIcon" data-up2="${up}" data-id="${id}" data-k="${k}" aria-label="Velg ikon">${icn(v)}</button>`;
const ICONS = {
  'Oppgaver': '🪥 🛏️ 📚 📖 ✏️ 🧸 🍽️ 🗑️ 🧽 🧹 🧺 👕 🧦 🪴 🐕 🐈 🚿 🛁 🧼 🍳 👨‍🍳 🥗 🛒 🚗 🔨 🪛 🧰 🚲 ⚽ 🎹 🎸 🏃 🥾 🌲 ❄️ 🍂 📦 💤 🙏 🤝',
  'Spill og tid': '🎮 🕹️ 👾 🚀 🏆 ⏱️ ⌛ 📱 💻 🖥️ 📺 🎧 🧩 ♟️ 🎲 ⚡ 🔥 💎 ⭐ 🌟',
  'Belønninger': '🍔 🍟 🍕 🌭 🌮 🍦 🍩 🍫 🍿 🥤 🎬 🎡 🎢 🏊 🎳 ⛸️ 🏕️ 🛏️ 🏠 🎁 🛍️ 💸 🧁 🎂 🎉 🎟️ 🚌 ✈️',
  'Avatarer': '🦖 🦄 🐼 🦁 🐯 🐻 🐨 🐸 🐵 🦊 🐶 🐱 🐰 🐧 🦈 🐙 🦋 🐲 👽 🤖 👻 🥷 🧙 🧚 🦸 🧜 🏎️ ⚡'
};

/* ---------- data ---------- */
function loadDemo() {
  try { const s = JSON.parse(localStorage.getItem('gc-demo')); if (s && s.kids) return L.migrate(s); } catch {}
  return L.defaultState();
}
function saveDemo() { try { localStorage.setItem('gc-demo', JSON.stringify(A.S)); } catch {} }

async function boot() {
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    const j = await r.json();
    if (!j || !j.state) throw 0;
    A.mode = 'server'; setServer(j);
    setInterval(poll, 2500);
  } catch {
    A.mode = 'demo'; A.S = loadDemo();
    setInterval(() => { if (L.tick(A.S, Date.now())) { saveDemo(); schedule(); } }, 1000);
    setInterval(() => { L.recordUsage(A.S, Date.now(), null); saveDemo(); schedule(); }, 60000);
  }
  for (const k of A.S.kids) A.prevCoins[k.id] = k.coins;
  render();
  setInterval(tickUI, 1000);
}
function setServer(j) { A.offset = j.now - Date.now(); A.S = j.state; A.offline = false; }
async function poll() {
  try {
    const r = await fetch('api/state?rev=' + A.S.rev, { cache: 'no-store' }); const j = await r.json();
    const was = A.offline, rev = A.S.rev;
    if (j.same) { A.offset = j.now - Date.now(); A.offline = false; if (was) schedule(); return; }
    setServer(j);
    if (j.state.rev !== rev || was) schedule();
  } catch { if (!A.offline) { A.offline = true; schedule(); } }
}

async function act(a, quiet) {
  if (L.PARENT.has(a.type) || (A.pin && A.screen === 'parent')) a.pin = A.pin;
  if (A.kidPins && Object.keys(A.kidPins).length) a.kidPins = A.kidPins;
  try {
    let res;
    if (A.mode === 'demo') {
      if (a.type === 'routerTest' || a.type === 'routerClients' || a.type === 'routerScan') { A.modal = guideModal; render(); throw new Error(''); }
      if (/^ai(Image|ImagesAll|Cancel)$/.test(a.type)) throw new Error('AI-bilder lages av hjemmeserveren (gratis via Pollinations). Installer den først – i demoen kan du laste opp egne bilder.');
      if (a.type === 'notifyTest') throw new Error('E-post sendes fra hjemmeserveren – installer den først (se Hjelp og oppsett)');
      res = L.apply(A.S, a, Date.now()); saveDemo();
    } else {
      const r = await fetch('api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(a) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Noe gikk galt');
      setServer(j); res = j.result;
    }
    schedule(); return res;
  } catch (e) { if (e.message && !quiet) toast(e.message, true); throw e; }
}

/* ---------- render ---------- */
const editing = () => { const el = document.activeElement; return el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) && $app.contains(el); };
function schedule() { if (editing()) A.pending = true; else render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (A.pending && !editing()) { A.pending = false; render(); } }, 60));

function render() {
  A.pending = false;
  if (A.screen === 'kid' && !kidById(A.kidId)) A.screen = 'home';
  if (A.screen === 'parent' && !A.pin) A.screen = 'home';
  const body = A.screen === 'kid' ? viewKid(kidById(A.kidId)) : A.screen === 'parent' ? viewParent() : A.screen === 'family' ? viewFamily() : viewHome();
  const y = window.scrollY;
  $app.innerHTML = `<div class="wrap">${A.offline ? '<div class="offline">Mistet kontakt med hjemmeserveren – prøver igjen…</div>' : ''}${body}</div>${A.modal ? `<div class="scrim${A.modalFresh ? ' anim' : ''}" data-act="closeModal"><div class="modal" data-stop>${A.modal()}</div></div>` : ''}`;
  window.scrollTo(0, y);
  A.modalFresh = false; A.paneFresh = false;
  celebrate();
  tickUI();
  if (A.race) raceUpdate();
}

const CATSTYLE = { daglig: '#16c28f', skole: '#8b7bff', hjemme: '#2fa4ff', ute: '#ffb020', stort: '#ff7a45', familie: '#6a45ff' };
const rewardOf = (x) => x.family || x.category === 'familie' ? `${gem}+${x.coins}` : `${coin}+${x.coins}`;
const TINTS = ['#ff7a45', '#2fa4ff', '#16c28f', '#ff5fa2', '#8b7bff', '#ffb020'];

function viewHome() {
  const w = L.windowInfo(A.S, now());
  const pend = pendCount();
  return `
  <header class="top">
    <div class="brand"><span class="logo">${coin}</span>
      <div><div class="wm">Gaming <b>Coins</b></div><div class="sub">Gjør oppdrag · tjen coins · kjøp spilletid</div></div></div>
    <div class="grow"></div>
    <div class="status"><span class="win ${w.open ? 'open' : ''}">${esc(w.label)}</span><span class="clock" data-clock></span></div>
  </header>
  ${raceLive()}${raceInvites()}
  ${famBanner()}
  <main class="kids">${A.S.kids.map((k) => {
    const act = A.S.jobs.filter((j) => j.kidId === k.id && j.status === 'active').length;
    const pen = A.S.jobs.filter((j) => j.kidId === k.id && j.status === 'pending').length;
    const rew = (A.S.rewards || []).some((r) => r.kidId === k.id && r.status === 'pending' && !r.family);
    const lreq = (A.S.loans || []).filter((l) => l.lenderId === k.id && l.status === 'requested').length;
    const lv = L.level(k.lifetime);
    return `<button class="kid ${k.playing ? 'playing' : ''}" style="--c:${esc(k.color)}" data-act="openKid" data-id="${k.id}">
      <div class="hero"><span class="lvl">Nivå ${lv.lvl}</span>${k.playing ? `<span class="live">${ic('play')} Spiller</span>` : ''}<div class="av">${kidAv(k)}</div></div>
      <div class="kbody">
        <h2>${esc(k.name)}</h2>
        <div class="token">${coin}<span>${k.coins}</span></div>
        <div class="stats">
          <div class="stat"><small>${k.playing ? 'Igjen' : 'Spilletid'}</small><b data-bank="${k.id}"></b></div>
          <div class="stat"><small>Nivå ${lv.lvl}</small><span class="xp"><i style="width:${Math.max(4, lv.pct)}%"></i></span></div>
          <div class="stat"><small>På rad</small><b>${k.streak || 0} ${k.streak === 1 ? 'dag' : 'dager'}</b></div>
        </div>
        ${act || pen || rew || lreq ? `<div class="chips">
          ${lreq ? `<span class="chip hot">Låneforespørsel</span>` : ''}
          ${act ? `<span class="chip gold">${act} oppdrag i gang</span>` : ''}
          ${pen ? `<span class="chip hot">${pen} venter på godkjenning</span>` : ''}
          ${rew ? `<span class="chip">Belønning på vei</span>` : ''}</div>` : '<div class="chips"><span class="chip soft">Trykk for å se oppdrag</span></div>'}
      </div></button>`;
  }).join('') || '<div class="empty">Ingen barn lagt inn ennå – trykk på Foreldre for å komme i gang.</div>'}</main>
  <div class="dock"><span>${A.mode === 'demo' ? `<button class="note" data-act="openGuide">Demo-modus · PIN 1234 · <u>Slik setter du opp</u></button>` : ''}</span>
    <span class="row" style="gap:10px"><button class="pill round" data-act="toggleSound" aria-label="${SFX.on ? 'Slå av lyd' : 'Slå på lyd'}">${ic(SFX.on ? 'sound' : 'mute')}</button>
    <button class="pill" data-act="openParent">${ic('lock')} Foreldre ${pend ? `<span class="badge">${pend}</span>` : ''}</button></span></div>`;
}

/* ---------- familiepotten ---------- */
const famOn = () => A.S.family && (A.S.settings.family || {}).enabled !== false;
function famGoal() {
  const g = A.S.family.gems, list = (A.S.familyShop || []).slice().sort((a, b) => a.cost - b.cost);
  return list.find((it) => it.cost > g) || list[list.length - 1] || null;
}
function famBanner() {
  if (!famOn()) return '';
  const g = A.S.family.gems, goal = famGoal();
  const pct = goal ? Math.min(100, Math.round(g / goal.cost * 100)) : 0;
  return `<button class="famban" data-act="openFamily">
    <span class="fbig">💎</span>
    <div><h2>Familien</h2><div class="fsub">Felles pott – alle samler sammen</div></div>
    <div class="token gems">${gem}<span>${g}</span></div>
    ${goal ? `<div class="fgoal"><div class="fsub">${g >= goal.cost ? 'Dere har nok til' : 'Neste mål'}: ${icn(goal.emoji)} ${esc(goal.title)}</div>
      <div class="fbar"><i style="width:${Math.max(4, pct)}%"></i><span>${Math.min(g, goal.cost)} / ${goal.cost} 💎</span></div></div>` : '<div class="grow"></div>'}
    <span class="avs">${A.S.kids.slice(0, 5).map((k) => `<span style="background:${esc(k.color)}">${icn(k.avatar)}</span>`).join('')}</span></button>`;
}
function famCard(it, i) {
  const g = A.S.family.gems, can = g >= it.cost, pct = Math.min(100, Math.round(g / it.cost * 100));
  return `<div class="card product fam ${can ? '' : 'locked'}" style="--k:${TINTS[(i + 4) % TINTS.length]}">
    <div class="pmedia ${it.image ? 'photo' : ''}" style="--k:${TINTS[(i + 4) % TINTS.length]}">${it.image ? `<img src="${esc(it.image)}" alt="" loading="lazy">` : `<span class="qicon">${icn(it.emoji)}</span>`}<span class="pbadge gemb">Familie</span></div>
    <div class="pbody"><h3>${esc(it.title)}</h3>${it.desc ? `<p class="pdesc">${esc(it.desc)}</p>` : ''}
      <div class="pfoot"><div class="price">${gem} ${it.cost}</div>
        <button class="btn gemb sm" data-act="fbuy" data-id="${it.id}" ${can ? '' : 'disabled'}>${can ? 'Kjøp' : `Mangler ${it.cost - g}`}</button></div>
      ${can ? '' : `<div class="save" title="Spart ${pct} %"><i style="width:${pct}%"></i></div>`}</div></div>`;
}
function famActions(me, cpg, kidPick) {
  const n = now();
  const tasks = A.S.tasks.filter((t) => t.category === 'familie' && (!me || !t.kidIds?.length || t.kidIds.includes(me.id)));
  const mine = me ? A.S.jobs.filter((j) => j.kidId === me.id && j.family && ['active', 'pending'].includes(j.status)) : [];
  return `<h2 class="sec"><span class="dot" style="--k:var(--gold)"></span>Bli med og samle 💎</h2>
  <div class="card loanform">${kidPick}
    ${me ? `<div class="row" style="gap:10px;flex-wrap:wrap">
      <button class="btn gemb" data-act="famPlay" data-id="${me.id}">${ic('game')} Spill læringsspill</button>
      <button class="btn ghost" data-act="famTasksJump">${ic('list')} Se familieoppdrag</button></div>
      <div class="fld" style="margin-top:6px">Gi coins til potten (${cpg} coins = 1 💎)</div>
      <div class="row" style="gap:8px;flex-wrap:wrap">${[1, 2, 5, 10].map((v) => `<button class="btn gemb sm" data-act="fdonate" data-id="${me.id}" data-v="${v}" ${me.coins >= v * cpg ? '' : 'disabled'}>${coin} ${v * cpg} → ${v} 💎</button>`).join('')}</div>
      <small class="mute">${esc(me.name)} har ${me.coins} coins.</small>` : '<small class="mute">Trykk på deg selv for å spille, ta familieoppdrag eller gi coins.</small>'}</div>
  ${mine.length ? `<div class="list" style="margin-top:12px">${mine.map((j) => `<div class="li"><span class="qicon xs">${icn(j.emoji)}</span><div class="grow"><b>${esc(j.title)}</b>
    <div class="when">${j.status === 'active' ? 'Frist kl. ' + hhmm(j.deadline) : 'Venter på mamma eller pappa'}</div></div>
    ${j.status === 'active' ? `<button class="btn ok sm" data-act="done" data-id="${j.id}">${ic('check')} Ferdig!</button>` : `<span class="reward inline">${gem}+${j.coins}</span>`}</div>`).join('')}</div>` : ''}
  ${tasks.length ? `<h2 class="sec" id="famtasks"><span class="dot" style="--k:#6a45ff"></span>Familieoppdrag<span class="count">gir 💎 til potten</span></h2>
  <div class="grid">${tasks.map((t) => {
    const ok = me ? L.taskAvailable(A.S, t, me, n) : true;
    return `<div class="card qcard ${ok ? '' : 'done'}" style="--k:#6a45ff">
      <div class="qmedia">${t.image ? `<img src="${esc(t.image)}" alt="" loading="lazy">` : `<span class="qemoji">${icn(t.emoji)}</span>`}
        <span class="qcoin">${gem}+${t.coins}</span><span class="qtime">${ic('clock')} ${t.deadlineMin} min</span>
        ${ok ? '' : `<span class="qdone">${ic('check')} Tatt</span>`}</div>
      <div class="qbody"><h3>${esc(t.title)}</h3>
        ${ok ? `<button class="btn gemb" data-act="famTake" data-id="${t.id}" data-kid="${me ? me.id : ''}" ${me ? '' : 'disabled'}>${ic('play')} ${me ? 'Ta oppdraget' : 'Velg deg selv først'}</button>` : ''}</div></div>`; }).join('')}</div>` : ''}`;
}
function viewFamily() {
  const F = A.S.family, fc = A.S.settings.family || {}, g = F.gems;
  const by = F.by || {}, max = Math.max(1, ...A.S.kids.map((k) => by[k.id] || 0));
  const nm = (id) => { const x = kidById(id); return x ? `${icn(x.avatar)} ${esc(x.name)}` : '👨‍👩‍👧 Familien'; };
  const rw = (A.S.rewards || []).filter((r) => r.family).sort((a, b) => b.at - a.at).slice(0, 8);
  const st = { pending: ['gold', 'Venter på mamma og pappa'], done: ['go', 'Gjennomført 🎉'], refunded: ['', 'Avlyst – diamanter tilbake'] };
  const kidPick = A.S.kids.length > 1 ? `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="mute" style="font-weight:800">Hvem er du?</span>${A.S.kids.map((k) => `<button class="lpick ${A.famKid === k.id ? 'on' : ''}" data-act="famKid" data-id="${k.id}" style="--c:${esc(k.color)}"><span class="av">${icn(k.avatar)}</span><b>${esc(k.name)}</b><small>${k.coins} coins</small></button>`).join('')}</div>` : '';
  const me = kidById(A.famKid) || (A.S.kids.length === 1 ? A.S.kids[0] : null);
  const cpg = fc.coinsPerGem || 10;
  return `<div class="khead fam">
    <button class="back" data-act="home" aria-label="Tilbake">${ic('back')}</button>
    <div class="av" style="background:#fff">💎</div>
    <div class="kinfo"><h1>Familien</h1><div class="kmeta"><span>Felles diamanter for hele familien</span></div>
      ${(() => { const goal = famGoal(); if (!goal) return ''; const pct = Math.min(100, Math.round(g / goal.cost * 100));
        return `<div class="xpbar" style="background:rgba(255,255,255,.45)"><i style="width:${Math.max(3, pct)}%;background:linear-gradient(90deg,#b8f4ff,#fff)"></i><span style="color:#2a1670;text-shadow:0 1px 0 rgba(255,255,255,.7)">${Math.min(g, goal.cost)} / ${goal.cost} 💎 til ${esc(goal.title)}</span></div>`; })()}</div>
    <div class="token gems big">${gem}<span>${g}</span></div></div>

    shell(`<div class="fc-view"><video playsinline autoplay muted></video><div class="fc-ring"></div></div>
      <p class="rc-small">Hold fjeset inni sirkelen og smil! 😁</p>
      <div class="rc-row"><button class="rc-btn ghost" data-fc="file">🖼️ Velg bilde</button><button class="rc-btn go fc-shot" data-fc="shot" aria-label="Ta bilde">📸</button></div>`);
    const v = el.querySelector('video');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 } }, audio: false }).then((s) => { stream = s; v.srcObject = s; }).catch(() => { stop(); pickOnly(); });
  };
  const pickOnly = () => {
    shell(`<div class="fc-mid"><div class="rc-big">🤳</div><p>Trykk på knappen og ta et bilde med kameraet.</p></div>
      <div class="rc-row"><button class="rc-btn go" data-fc="file">📸 Ta bilde</button></div>`);
  };
  const crop = (im) => {
    stop(); img = im; zoom = 1; ox = 0; oy = 0;
    shell(`<div class="fc-view"><canvas width="600" height="600"></canvas><div class="fc-ring"></div></div>
      <p class="rc-small">Dra for å flytte · bruk spaken for å zoome</p>
      <input class="fc-zoom" type="range" min="1" max="3" step="0.01" value="1">
      <div class="rc-row"><button class="rc-btn ghost" data-fc="redo">🔄 Prøv igjen</button><button class="rc-btn go" data-fc="use">✔ Bruk bildet</button></div>`);
    const cv = el.querySelector('canvas'), cx = cv.getContext('2d');

    cv.addEventListener('pointermove', (e) => { if (!d) return; const w = cv.getBoundingClientRect().width; ox = d.ox + (e.clientX - d.x) / w / zoom; oy = d.oy + (e.clientY - d.y) / w / zoom; draw(); });

      catch (err) { toast(err.message || 'Kunne ikke lagre bildet', true); b.disabled = false; b.textContent = '✔ Bruk bildet'; }
    }
  });

}

/* ---------- lommebok og lån ---------- */

  const mine = loans.filter((l) => l.borrowerId === k.id && ['requested', 'parent'].includes(l.status));

      <input id="loan-note" class="in" placeholder="Hva skal du bruke det til? (valgfritt)" maxlength="80" value="${esc(lf.note || '')}">
      <button class="btn gold" data-act="loanAsk" ${lf.lender && lf.amount ? '' : 'disabled'}>Spør om å låne${lf.amount ? ` ${lf.amount} coins` : ''}</button>

  if (mine.length) h += `<h2 class="sec"><span class="dot" style="--k:#ff5fa2"></span>Mine forespørsler</h2><div class="list">${mine.map((l) => `

const fmtM = (m) => { m = Math.round(m || 0); return m >= 60 ? `${Math.floor(m / 60)} t${m % 60 ? ' ' + (m % 60) + ' min' : ''}` : `${m} min`; };
const lastDays = (n) => Array.from({ length: n }, (_, i) => L.dayKey(now() - (n - 1 - i) * 864e5));
function usedFor(day, filter) { const D = (A.S.stats || { days: {} }).days[day]; if (!D) return 0; return Object.entries(D.dev || {}).filter(([mac, r]) => filter(mac, r)).reduce((t, [, r]) => t + (r.used || 0), 0); }

function pStats() {
  const S = A.S.stats || { days: {} }, days = lastDays(7), devs = L.allDevices(A.S), kids = A.S.kids;
  const today = days[6];
  const perKid = days.map((d) => kids.map((k) => usedFor(d, (mac, r) => r.kid === k.id)));
  const totals = perKid.map((a) => a.reduce((x, y) => x + y, 0));
  const week = totals.reduce((a, b) => a + b, 0), max = Math.max(30, ...totals);
  const devWeek = devs.map((d) => ({ ...d, week: days.reduce((t, day) => t + ((S.days[day] || {}).dev?.[d.mac]?.used || 0), 0), today: (S.days[today] || {}).dev?.[d.mac]?.used || 0 }))
    .sort((a, b) => b.week - a.week);
  const hours = Array(24).fill(0); for (const day of days) for (const r of Object.values((S.days[day] || {}).dev || {})) (r.hours || []).forEach((v, h) => { hours[h] += v; });
  const hmax = Math.max(1, ...hours), peak = hours.indexOf(Math.max(...hours));
  const play = kids.map((k) => ({ k, today: (S.days[today] || {}).play?.[k.id] || 0, week: days.reduce((t, d) => t + ((S.days[d] || {}).play?.[k.id] || 0), 0) }));
  const empty = !week && !play.some((p) => p.week);
  const dmax = Math.max(1, ...devWeek.map((d) => d.week));
  const wd = (d) => new Date(d + 'T12:00').toLocaleDateString('no-NO', { weekday: 'short' }).replace('.', '');
  return `${empty ? `<div class="panel"><h3>Ingen data ennå</h3><p class="mute">Statistikken fylles minutt for minutt når barnas enheter er lagt inn og appen kjører på hjemmeserveren.</p>
      ${A.mode === 'demo' ? '<button class="btn gold" data-act="demoStats">Vis med eksempeldata</button>' : ''}</div>` : ''}
  <div class="grid wstats" style="margin-bottom:18px">
    <div class="card wstat"><small class="mute">På nett i dag</small><b class="wnum">${fmtM(totals[6])}</b></div>
    <div class="card wstat"><small class="mute">Siste 7 dager</small><b class="wnum">${fmtM(week)}</b></div>
    <div class="card wstat"><small class="mute">Snitt per dag</small><b class="wnum">${fmtM(week / 7)}</b></div>
    <div class="card wstat"><small class="mute">Travleste time</small><b class="wnum">${week ? `kl. ${String(peak).padStart(2, '0')}–${String((peak + 1) % 24).padStart(2, '0')}` : '–'}</b></div></div>
  <div class="panel"><h3>Tid på internett per dag</h3>
    <div class="legend">${kids.map((k) => `<span><i style="background:${esc(k.color)}"></i>${esc(k.name)}</span>`).join('')}</div>
    <div class="stack7">${days.map((d, i) => `<div class="scol" title="${wd(d)}: ${kids.map((k, j) => `${k.name} ${fmtM(perKid[i][j])}`).join(', ')}">
      <b class="stot">${totals[i] ? fmtM(totals[i]) : ''}</b>
      <div class="sbar" style="height:${Math.max(0, totals[i] / max * 100)}%">${kids.map((k, j) => perKid[i][j] ? `<i style="flex:${perKid[i][j]};background:${esc(k.color)}"></i>` : '').join('')}</div>
      <small class="${i === 6 ? 'today' : ''}">${i === 6 ? 'I dag' : wd(d)}</small></div>`).join('')}</div>
    <p class="mute" style="font-size:14px">Tid på internett = minutter enheten hadde åpent internett og var på nett.</p></div>
  <div class="grid wide">
    <div class="panel"><h3>Mest brukte enheter (7 dager)</h3>${devWeek.length ? devWeek.map((d) => `<div class="hrow"><div class="hl"><b>${esc(d.name)}</b><small class="mute">${icn(d.kid.avatar)} ${esc(d.kid.name)}</small></div>
      <div class="htrack"><i style="width:${d.week / dmax * 100}%;background:${esc(d.kid.color)}"></i></div><span class="hv">${fmtM(d.week)}<small class="mute"> · i dag ${fmtM(d.today)}</small></span></div>`).join('') : '<p class="mute">Ingen enheter.</p>'}</div>
    <div class="panel"><h3>Når på døgnet? (7 dager)</h3><div class="heat">${hours.map((v, h) => `<div class="hc" title="kl. ${String(h).padStart(2, '0')}: ${fmtM(v)}" style="--a:${v ? 0.15 + 0.85 * v / hmax : 0}"><span>${h % 6 === 0 ? String(h).padStart(2, '0') : ''}</span></div>`).join('')}</div>
      <p class="mute" style="font-size:14px">Mørkere = mer tid på nett den timen.</p>
      <h3 style="margin-top:16px">Spilletid brukt (fra coins)</h3>${play.map((p) => `<div class="li"><span>${icn(p.k.avatar)}</span><b class="grow">${esc(p.k.name)}</b><span class="when">i dag ${fmtM(p.today)} · uke ${fmtM(p.week)}</span></div>`).join('')}</div></div>`;
}
function seedDemoStats() {
  const s = A.S;
  const sample = [['PlayStation 5', 'AA:BB:CC:00:00:01'], ['iPad', 'AA:BB:CC:00:00:02'], ['Nintendo Switch', 'AA:BB:CC:00:00:03']];
  s.kids.forEach((k, i) => { if (!(k.devices || []).length) k.devices = [{ name: sample[i % 3][0], mac: sample[i % 3][1].replace(/01$|02$|03$/, (x) => String(i + 1).padStart(2, '0')) }]; });
  for (let i = 6; i >= 0; i--) {
    const day = L.dayKey(Date.now() - i * 864e5), D = (s.stats.days[day] = { dev: {}, play: {} });
    for (const { kid, mac } of L.allDevices(s)) {
      const hours = Array(24).fill(0); let used = 0;
      for (const h of [15, 16, 17, 18, 19, 20]) { const v = Math.max(0, Math.round((Math.random() * 40 - 8) * (h === 18 || h === 19 ? 1.5 : 1))); hours[h] = Math.min(60, v); used += hours[h]; }
      D.dev[mac] = { open: used + 10, online: used + 30, used, hours, kid: kid.id };
      D.play[kid.id] = Math.round(used * 0.9);
    }
  }
  s.rev++; saveDemo();
}

    const k = kidById(j.kidId) || { avatar: '?', name: '?', color: '#999' };
    const onTime = j.doneAt <= j.deadline;
    const part = Math.round(j.coins * late / 100);
    return `<div class="appr"><div class="av" style="--c:${esc(k.color)}">${icn(k.avatar)}</div>
      <div><b style="font-size:19px">${icn(j.emoji)} ${esc(j.title)}</b>

        <span class="tag ${onTime ? '' : 'late'}">${onTime ? 'Innenfor fristen' : 'For sent'}</span>${j.flag === 'fast' ? ' <span class="tag late">Veldig raskt – sjekk</span>' : ''}</div>
      <div class="row acts">
        <button class="btn ok sm" data-act="approve" data-id="${j.id}" data-v="100">${ic('check')} +${j.coins}${j.family ? ' 💎' : ''}</button>
        ${part !== j.coins ? `<button class="btn gold sm" data-act="approve" data-id="${j.id}" data-v="${late}">Delvis +${part}</button>` : ''}
        <button class="btn bad sm" data-act="reject" data-id="${j.id}">${ic('x')}</button></div></div>`;
  }).join('') : '<p class="mute">Ingenting å godkjenne akkurat nå.</p>'}</div>`;
  const rw = (A.S.rewards || []).filter((r) => r.status === 'pending').sort((a, b) => a.at - b.at);
  if (rw.length) h += `<div class="panel"><h3>Belønninger som skal innfris</h3>${rw.map((r) => { const k = kidById(r.kidId) || (r.family ? { avatar: '💎', name: 'Familien', color: '#6a45ff' } : { avatar: '?', name: '?', color: '#999' });

      <div><b style="font-size:19px">${icn(r.emoji)} ${esc(r.title)}</b>${r.family ? ' <span class="tag" style="background:#6a45ff;color:#fff">Familie</span>' : ''}<div class="mute">${r.family ? 'Familiepotten' + (r.kidId ? ' · valgt av ' + esc(k.name) : '') : esc(k.name)} · kjøpt ${new Date(r.at).toLocaleDateString('no-NO', { weekday: 'short', day: 'numeric', month: 'short' })} kl. ${hhmm(r.at)} · ${r.cost} ${r.family ? 'diamanter' : 'coins'}</div></div>
      <div class="row acts"><button class="btn ok sm" data-act="fulfill" data-id="${r.id}">${ic('check')} Innfridd</button>
        <button class="btn ghost sm" data-act="refund" data-id="${r.id}">Avlys</button></div></div>`; }).join('')}</div>`;
  const loans = A.S.loans || [];
  const nmk = (id) => { const x = kidById(id); return x ? `${icn(x.avatar)} ${esc(x.name)}` : '?'; };
  const lp = loans.filter((l) => l.status === 'parent');
  if (lp.length) h += `<div class="panel"><h3>Lån som venter på dere</h3>${lp.map((l) => `<div class="appr" style="grid-template-columns:minmax(0,1fr) auto">

    <div class="row acts"><button class="btn ok sm" data-act="loanParent" data-id="${l.id}" data-v="1">${ic('check')} Godkjenn</button>

  const lo = loans.filter((l) => ['requested', 'active'].includes(l.status) || (['repaid', 'forgiven'].includes(l.status) && l.doneAt > Date.now() - 14 * 864e5));
  if (lo.length) {
    const st = { requested: 'Venter på svar', active: 'Aktivt', repaid: 'Betalt tilbake', forgiven: 'Slettet av foreldre' };
    h += `<div class="panel"><h3>Lån mellom barna – oversikt</h3><div class="scroll"><table class="ltab"><thead><tr><th>Låntaker</th><th>Långiver</th><th class="num">Lånt</th><th class="num">Betalt</th><th class="num">Igjen</th><th>Status</th><th></th></tr></thead><tbody>
      ${lo.map((l) => `<tr><td>${nmk(l.borrowerId)}</td><td>${nmk(l.lenderId)}</td><td class="num">${l.amount}</td><td class="num">${l.paid}</td><td class="num"><b>${l.amount - l.paid}</b></td>
        <td><span class="tag ${l.status === 'active' ? 'late' : ''}">${st[l.status] || l.status}</span><div class="when">${new Date(l.startedAt || l.at).toLocaleDateString('no-NO', { day: 'numeric', month: 'short' })}</div></td>
        <td>${['requested', 'active'].includes(l.status) ? `<button class="btn ghost sm" data-act="loanCancel" data-id="${l.id}">${l.status === 'active' ? 'Slett resten' : 'Avbryt'}</button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if (act.length) h += `<div class="panel"><h3>Oppgaver som er i gang</h3>${act.map((j) => { const k = kidById(j.kidId) || {};
    return `<div class="li">${icn(k.avatar)} <b>${esc(k.name)}</b> <span class="grow">${icn(j.emoji)} ${esc(j.title)}</span><span class="when">frist ${hhmm(j.deadline)}</span></div>`; }).join('')}</div>`;

    <p class="mute">Lurte noen? Trykk «Lurte» for å ta tilbake coinsene og gi straff.</p>${autoJ.map((j) => { const k = kidById(j.kidId) || { avatar: '?', name: '?', color: '#999' };

function imageToIcon(file) {
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const N = 160, c = document.createElement('canvas'); c.width = c.height = N;
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, N, N);
      URL.revokeObjectURL(url);
      let d = c.toDataURL('image/webp', 0.85);
      if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/png');
      ok(d);
    };
    img.onerror = () => bad(new Error('Kunne ikke lese bildet'));
    img.src = url;
  });
}
function ago(t) {
  if (!t) return 'kjent fra ruteren';

  const h = Math.round(m / 60); if (h < 24) return `sett for ${h} t siden`;
  const d = Math.round(h / 24); return d === 1 ? 'sett i går' : `sett for ${d} dager siden`;
}

/* Produktbilde: beskjæres til 4:3 og krympes, så butikken blir rask */
function imageToProduct(file) {
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const W = 800, H = 600, c = document.createElement('canvas'); c.width = W; c.height = H;
      const r = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * r, h = img.naturalHeight * r;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url);
      let d = c.toDataURL('image/webp', 0.82); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', 0.82);
      ok(d);
    };
    img.onerror = () => bad(new Error('Kunne ikke lese bildet'));
    img.src = url;
  });
}

function tickUI() {
  const n = now();
  for (const el of document.querySelectorAll('[data-clock]')) el.textContent = hhmm(n);
  for (const el of document.querySelectorAll('[data-until]')) {
    const left = Number(el.dataset.until) - n, tot = Number(el.dataset.total);
    el.style.setProperty('--p', Math.max(0, left / tot));
    el.classList.toggle('warn', left < 5 * 60000);
    el.firstElementChild.textContent = left > 0 ? fmtDur(left / 1000) : '0:00';
  }
  for (const el of document.querySelectorAll('[data-bank]')) {
    const k = kidById(el.dataset.bank); if (!k) continue;
    const left = L.bankLeft(k, n);
    el.textContent = 'full' in el.dataset || k.playing ? fmtDur(left) : fmtMin(left);
  }
  if (A.screen !== 'home' && Date.now() - A.lastTouch > 90000) { A.screen = 'home'; A.pin = null; A.modal = null; render(); }
}
